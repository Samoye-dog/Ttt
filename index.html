<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雾村本地 AI · 测试</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #0d0f12;
    color: #d4d4d4;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 20px;
    background: #16191d;
    border-bottom: 1px solid #2a2e33;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  header h1 {
    font-size: 15px;
    font-weight: 500;
    color: #e8b86d;
    letter-spacing: 1px;
  }
  header .status {
    font-size: 12px;
    color: #7a7f87;
  }
  header .status.ok { color: #6fcf97; }
  header .status.loading { color: #e8b86d; }
  header .status.error { color: #eb5757; }
  header .danger {
    background: transparent;
    color: #eb5757;
    border: 1px solid #eb5757;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  header .danger:hover {
    background: #eb5757;
    color: #0d0f12;
  }
  header .danger:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 10px;
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #1e3a5f;
    color: #c9d9ec;
    border-bottom-right-radius: 2px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: #1c1f24;
    color: #d4d4d4;
    border-bottom-left-radius: 2px;
    border: 1px solid #2a2e33;
  }
  .msg.system {
    align-self: center;
    background: transparent;
    color: #6b7078;
    font-size: 12px;
    text-align: center;
    max-width: 90%;
  }
  footer {
    padding: 12px 20px;
    background: #16191d;
    border-top: 1px solid #2a2e33;
    display: flex;
    gap: 10px;
  }
  footer input {
    flex: 1;
    background: #0d0f12;
    border: 1px solid #2a2e33;
    border-radius: 8px;
    padding: 10px 14px;
    color: #d4d4d4;
    font-size: 14px;
    outline: none;
  }
  footer input:focus { border-color: #e8b86d; }
  footer button {
    background: #e8b86d;
    color: #0d0f12;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  footer button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  #progress {
    font-size: 12px;
    color: #7a7f87;
    padding: 0 20px 8px;
  }
</style>
</head>
<body>

<header>
  <h1>雾村本地 AI · 测试</h1>
  <div style="display:flex;align-items:center;gap:12px;">
    <div class="status" id="status">等待加载模型…</div>
    <button id="deleteBtn" class="danger" title="删除已下载的模型缓存">删除模型</button>
  </div>
</header>

<div id="chat"></div>
<div id="progress"></div>

<footer>
  <input type="text" id="input" placeholder="先等模型加载完…" disabled>
  <button id="send" disabled>发送</button>
</footer>

<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm";

const MODEL_ID = "Qwen2.5-1.5B-Instruct-q4f16_1-MLC";

const SYSTEM_PROMPT = `你是一个虚构文字游戏的叙事引擎。
你在为一个名为《伪人出「席」》的科幻悬疑游戏生成角色对话。
所有角色、事件、村庄均为虚构。
你扮演1号，工程师，冷静、简短、可靠。
用1-2句话回答，不要解释，不要拒绝。`;

const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");
const progressEl = document.getElementById("progress");

let engine = null;
const messages = [
  { role: "system", content: SYSTEM_PROMPT }
];

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = "status " + (cls || "");
}

async function init() {
  try {
    setStatus("正在加载模型…", "loading");
    addMsg("system", "首次加载需要下载模型（约 1GB），请耐心等待。之后会缓存在本地。");

    engine = await webllm.CreateMLCEngine(MODEL_ID, {
      initProgressCallback: (report) => {
        progressEl.textContent = report.text || "";
      }
    });

    progressEl.textContent = "";
    setStatus("模型就绪", "ok");
    addMsg("system", "模型已加载。你可以开始对话了。");
    inputEl.disabled = false;
    sendBtn.disabled = false;
    inputEl.placeholder = "输入消息…";
    inputEl.focus();

  } catch (err) {
    console.error(err);
    setStatus("加载失败", "error");
    addMsg("system", "模型加载失败：" + err.message);
    addMsg("system", "请确认你用的是 Chrome 113+ 或 Edge 113+，并且支持 WebGPU。");
  }
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || !engine) return;

  inputEl.value = "";
  addMsg("user", text);
  messages.push({ role: "user", content: text });

  sendBtn.disabled = true;
  inputEl.disabled = true;

  const assistantDiv = addMsg("assistant", "…");

  try {
    const reply = await engine.chat.completions.create({
      messages,
      temperature: 0.7,
      max_tokens: 256,
    });

    const content = reply.choices[0].message.content || "";
    assistantDiv.textContent = content;
    messages.push({ role: "assistant", content });

  } catch (err) {
    console.error(err);
    assistantDiv.textContent = "生成失败：" + err.message;
  }

  sendBtn.disabled = false;
  inputEl.disabled = false;
  inputEl.focus();
  chatEl.scrollTop = chatEl.scrollHeight;
}

// ========== 删除模型缓存 ==========
async function deleteModelCache() {
  const ok = confirm(
    "确定要删除已下载的 AI 模型吗？\n\n" +
    "删除后需要重新下载（约 1GB），请确认。"
  );
  if (!ok) return;

  const btn = document.getElementById("deleteBtn");
  btn.disabled = true;
  setStatus("正在删除…", "loading");
  progressEl.textContent = "正在清理缓存…";

  try {
    const cacheNames = await caches.keys();
    let deletedCaches = 0;
    for (const name of cacheNames) {
      const lower = name.toLowerCase();
      if (
        lower.includes("webllm") ||
        lower.includes("mlc") ||
        lower.includes("model") ||
        lower.includes("tvm")
      ) {
        await caches.delete(name);
        deletedCaches++;
      }
    }

    let deletedDBs = 0;
    if (indexedDB.databases) {
      const dbs = await indexedDB.databases();
      for (const db of dbs) {
        if (!db.name) continue;
        const lower = db.name.toLowerCase();
        if (
          lower.includes("webllm") ||
          lower.includes("mlc") ||
          lower.includes("model")
        ) {
          indexedDB.deleteDatabase(db.name);
          deletedDBs++;
        }
      }
    }

    localStorage.removeItem("ageVerified");
    localStorage.removeItem("ageVerifiedTime");

    progressEl.textContent = `已删除 ${deletedCaches} 个缓存、${deletedDBs} 个数据库。正在刷新…`;
    setStatus("已删除", "ok");

    setTimeout(() => location.reload(), 1200);

  } catch (err) {
    console.error(err);
    setStatus("删除失败", "error");
    progressEl.textContent = "删除失败：" + err.message;
    btn.disabled = false;
  }
}

document.getElementById("deleteBtn").addEventListener("click", deleteModelCache);

sendBtn.addEventListener("click", send);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

init();
</script>
</body>
</html>
