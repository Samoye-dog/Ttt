<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>MaralGPT Mythos 9B - 本地聊天</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background: #0f0f0f; color: #e0e0e0; }
  #chat { border: 1px solid #333; border-radius: 8px; height: 60vh; overflow-y: auto; padding: 16px; margin-bottom: 12px; background: #1a1a1a; }
  .msg { margin: 8px 0; padding: 10px 14px; border-radius: 8px; max-width: 85%; line-height: 1.6; }
  .user { background: #1e3a5f; margin-left: auto; }
  .ai { background: #2a2a2a; }
  #input-area { display: flex; gap: 8px; }
  #input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #1a1a1a; color: #e0e0e0; font-size: 15px; }
  button { padding: 12px 20px; border-radius: 8px; border: none; background: #3b82f6; color: white; font-size: 15px; cursor: pointer; }
  button:disabled { background: #333; cursor: not-allowed; }
  #status { font-size: 13px; color: #888; margin-bottom: 12px; }
  #progress { width: 100%; height: 4px; background: #222; border-radius: 2px; margin-top: 8px; display: none; }
  #progress-bar { height: 100%; background: #3b82f6; border-radius: 2px; width: 0%; transition: width 0.3s; }
</style>
</head>
<body>
<h2>MaralGPT Mythos 9B · 本地互动叙事</h2>
<div id="status">正在初始化...</div>
<div id="progress"><div id="progress-bar"></div></div>
<div id="chat"></div>
<div id="input-area">
  <input id="input" placeholder="输入消息..." disabled onkeydown="if(event.key==='Enter')send()">
  <button id="send-btn" onclick="send()" disabled>发送</button>
</div>

<script type="module">
import { Wllama } from 'https://cdn.jsdelivr.net/npm/@wllama/wllama@2.3.1/esm/index.js';

const MODEL_URL = 'https://huggingface.co/liodon-ai/MaralGPT-Mythos-9B-2606-GGUF-imatrix-GGUF/resolve/main/MaralGPT-Mythos-9B-2606-Q4_K_M-imatrix.gguf';

let wllama = null;
let history = [];

const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const statusEl = document.getElementById('status');
const progressEl = document.getElementById('progress');
const progressBar = document.getElementById('progress-bar');

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function init() {
  try {
    wllama = new Wllama({
      'single-thread-wasm': { path: 'https://cdn.jsdelivr.net/npm/@wllama/wllama@2.3.1/esm/single-thread/wllama.wasm' },
      'multi-thread-wasm': { path: 'https://cdn.jsdelivr.net/npm/@wllama/wllama@2.3.1/esm/multi-thread/wllama.wasm' }
    });

    statusEl.textContent = '正在加载模型（首次需下载约 5.6GB，之后会从浏览器缓存读取）...';
    progressEl.style.display = 'block';

    await wllama.loadModelFromUrl(MODEL_URL, {
      useCache: true,
      n_ctx: 32768,
      progressCallback: ({ loaded, total }) => {
        const pct = total ? Math.round(loaded / total * 100) : 0;
        progressBar.style.width = pct + '%';
        statusEl.textContent = '下载/加载中... ' + pct + '%';
      }
    });

    statusEl.textContent = '模型已就绪，开始对话吧。';
    progressEl.style.display = 'none';
    inputEl.disabled = false;
    sendBtn.disabled = false;
    inputEl.focus();

  } catch (e) {
    statusEl.textContent = '加载失败：' + e.message;
    console.error(e);
  }
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  addMsg('user', text);
  sendBtn.disabled = true;

  history.push({ role: 'user', content: text });

  try {
    const aiDiv = document.createElement('div');
    aiDiv.className = 'msg ai';
    aiDiv.textContent = '...';
    chatEl.appendChild(aiDiv);

    let full = '';
    await wllama.createCompletion(history, {
      n_predict: 2048,
      temperature: 0.7,
      top_p: 0.95,
      top_k: 20,
      repeat_penalty: 1.05,
      stream: true,
      onNewToken: (token) => {
        full += token;
        aiDiv.textContent = full;
        chatEl.scrollTop = chatEl.scrollHeight;
      }
    });

    history.push({ role: 'assistant', content: full });
  } catch (e) {
    addMsg('ai', '生成出错：' + e.message);
  }
  sendBtn.disabled = false;
  inputEl.focus();
}

init();
</script>
</body>
</html>
